<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de gastos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Gestor de gastos</h1>
    <p class="sub">Equipo Pickled Pork Rinds</p>
  </header>

  <nav id="nav">
    <button data-vista="inicio" class="activo">Inicio</button>
    <button data-vista="agregar">Agregar</button>
    <button data-vista="ajustes">Ajustes</button>
  </nav>

  <main>
    <!-- SPRINT 1 -->
    <section id="inicio" class="vista activa">
      <h2>Gastos recientes</h2>
      <ul id="lista" class="lista"></ul>
    </section>

    <!-- SPRINT 1 -->
    <section id="agregar" class="vista">
      <form id="form" autocomplete="off">
        <label>Monto ($)
          <input id="monto" type="number" inputmode="decimal" step="0.01" min="0.01" required>
        </label>
        <label>Categoría
          <select id="categoria"></select>
        </label>
        <label>Nota (opcional)
          <input id="nota" type="text" maxlength="80">
        </label>
        <button type="submit" class="primario">Guardar gasto</button>
        <p id="estadoCaptura" class="nota" role="status"></p>
        <p id="tiempoRegistro" class="nota"></p>
      </form>
    </section>

    <!-- SPRINT 1 -->
    <section id="ajustes" class="vista">
      <form id="formAjustes">
        <label>Ingreso del periodo ($)
          <input id="ingreso" type="number" inputmode="decimal" step="0.01" min="0" required>
        </label>
        <label>Cada cuánto recibes dinero
          <select id="frecuencia">
            <option value="semanal">Semanal</option>
            <option value="quincenal">Quincenal</option>
            <option value="mensual">Mensual</option>
          </select>
        </label>
        <label>Fecha de tu siguiente ingreso
          <input id="siguiente" type="date" required>
        </label>
        <button type="submit" class="primario">Guardar ajustes</button>
        <p id="estadoAjustes" class="nota" role="status"></p>
      </form>
      <button id="btnBorrarTodo" class="peligro" type="button">Borrar todos los gastos</button>
    </section>
  </main>


  
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
